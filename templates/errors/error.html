<!DOCTYPE html>
<html lang="zh-Hant" class="material-style layout-fixed">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - NHRI 臨床研究數據平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/tailwind.generated.css') }}">

    <style nonce="{{ g.nonce }}">
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(59,130,246,0.10), transparent 35%),
                linear-gradient(to bottom right, #f8fafc, #eef2ff);
        }
    </style>
</head>

<body class="min-h-screen text-slate-800">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-2xl">

            <div class="mb-6 text-center">
                <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl {{ icon_bg_class }} shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 {{ icon_text_class }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.65 18h16.7a1 1 0 00.86-1.5l-7.5-13a1 1 0 00-1.72 0z" />
                    </svg>
                </div>
                <p class="text-sm font-medium tracking-wide text-blue-700">NHRI 臨床研究數據平台</p>
            </div>

            <section class="overflow-hidden rounded-3xl bg-white/90 shadow-xl backdrop-blur">
                <div class="border-b border-slate-100 {{ header_bg_class }} px-8 py-7">
                    <div class="flex items-start gap-4">
                        <div class="hidden sm:flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl {{ icon_bg_class }}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 {{ icon_text_class }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.65 18h16.7a1 1 0 00.86-1.5l-7.5-13a1 1 0 00-1.72 0z" />
                            </svg>
                        </div>

                        <div>
                            <div class="text-sm font-semibold {{ code_text_class }}">
                                Error {{ error_code }}
                            </div>

                            <h1 class="mt-1 text-2xl font-bold text-slate-900">
                                {{ title }}
                            </h1>

                            <p class="mt-2 text-sm leading-6 text-slate-600">
                                {{ message }}
                            </p>

                            {% if error_message %}
                            <div class="mt-4 rounded-xl bg-slate-100 p-3 text-xs text-slate-500 break-all">
                                {{ error_message }}
                            </div>
                            {% endif %}
                        </div>
                    </div>
                </div>

                <div class="px-8 py-7">
                    <div class="flex flex-col gap-3 sm:flex-row sm:justify-between">
                        <a href="{{ url_for('pages.index_page') }}"
                           class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700">
                            返回首頁
                        </a>

                        <button type="button"
                                class="btn-back inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-600 shadow-sm transition hover:bg-slate-50">
                            回上一頁
                        </button>
                    </div>
                </div>
            </section>

            <p class="mt-6 text-center text-xs text-slate-400">
                若問題持續發生，請提供錯誤畫面與時間給系統管理員協助排查。
            </p>
        </div>
    </main>
</body>
</html>

<script nonce="{{ g.nonce }}">
    document.querySelectorAll(".btn-back").forEach(function(btn) {
        btn.addEventListener("click", function() {
            history.back();
        });
    });
</script>
